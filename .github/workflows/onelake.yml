name: onelake-irc

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write   # required for OIDC federation
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # DuckDB's azure extension looks for the CA bundle at the RHEL path;
      # symlink it to Ubuntu's so SSL to onelake.blob.fabric.microsoft.com works.
      - name: Fix CA bundle path for Azure SDK
        run: |
          sudo mkdir -p /etc/pki/tls/certs
          sudo ln -sf /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt

      - run: python main.py
