name: catalogs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Catalog to run
        type: choice
        default: all
        options:
          - all
          - onelake
          - r2
          - s3_table
          - glue
          - unity
          - horizon
      debug:
        description: Print error details (may leak vended tokens)
        type: boolean
        default: false
  push:
    branches: [ main ]

permissions:
  id-token: write   # required for OneLake OIDC federation
  contents: read

jobs:
  # Turn the dispatch choice (or a push = all) into the matrix list.
  setup:
    runs-on: ubuntu-latest
    outputs:
      catalogs: ${{ steps.pick.outputs.catalogs }}
    steps:
      - id: pick
        run: |
          target="${{ inputs.target }}"
          [ -z "$target" ] && target="all"
          if [ "$target" = "all" ]; then
            echo 'catalogs=["onelake","r2","s3_table","glue","unity","horizon"]' >> "$GITHUB_OUTPUT"
          else
            echo "catalogs=[\"$target\"]" >> "$GITHUB_OUTPUT"
          fi

  # One job per selected catalog — re-run any single one.
  catalog:
    needs: setup
    if: ${{ needs.setup.outputs.catalogs != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.catalog }}
    strategy:
      fail-fast: false
      matrix:
        catalog: ${{ fromJSON(needs.setup.outputs.catalogs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC federation)
        if: matrix.catalog == 'onelake'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # DuckDB's azure extension looks for the CA bundle at the RHEL path;
      # symlink it to Ubuntu's so SSL to the Azure-backed storage (onelake,
      # unity) works. Harmless for r2/s3.
      - name: Fix CA bundle path for Azure SDK
        run: |
          sudo mkdir -p /etc/pki/tls/certs
          sudo ln -sf /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt

      - run: python main.py
        env:
          CATALOGS: ${{ matrix.catalog }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          # The var the azure extension's curl transport reads for its CA
          # bundle — not SSL_CERT_FILE or CURL_CA_BUNDLE.
          CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
          ENDPOINT_R2: ${{ secrets.ENDPOINT_R2 }}
          TOKEN_R2: ${{ secrets.TOKEN_R2 }}
          R2_WAREHOUSE: ${{ secrets.R2_WAREHOUSE }}
          S3_KEY: ${{ secrets.S3_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
          TABLEBUCKETARN: ${{ secrets.TABLEBUCKETARN }}
          GLUE_WAREHOUSE: ${{ secrets.GLUE_WAREHOUSE }}
          GLUE_REGION: ${{ secrets.GLUE_REGION }}
          GLUE_LOCATION: ${{ secrets.GLUE_LOCATION }}
          UC_ENDPOINT: ${{ secrets.UC_ENDPOINT }}
          UC_TOKEN: ${{ secrets.UC_TOKEN }}
          HORIZON_TOKEN: ${{ secrets.HORIZON_TOKEN }}
          HORIZON_ENDPOINT: ${{ secrets.HORIZON_ENDPOINT }}
