name: debug-glue

# Temporary: diagnose why a Glue write produces an empty table. Delete once solved.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_KEY: ${{ secrets.S3_KEY }}
  S3_SECRET: ${{ secrets.S3_SECRET }}
  GLUE_WAREHOUSE: ${{ secrets.GLUE_WAREHOUSE }}
  GLUE_REGION: ${{ secrets.GLUE_REGION }}
  GLUE_LOCATION: ${{ secrets.GLUE_LOCATION }}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt boto3

      - name: "variant A: ENDPOINT_TYPE glue"
        run: python debug_glue.py a
        continue-on-error: true

      - name: "variant B: explicit ENDPOINT + DISABLE_MULTI_TABLE_COMMIT"
        run: python debug_glue.py b
        continue-on-error: true

      # Bonus: does duckdb-iceberg main still silently lose the commit on the
      # generic attach? Nightly CLI zip nests the actual CLI zip inside it.
      - name: "nightly: duckdb main + core_nightly iceberg, generic attach"
        continue-on-error: true
        run: |
          curl -sSL https://artifacts.duckdb.org/latest/duckdb-binaries-linux-amd64.zip -o bundle.zip
          unzip -oq bundle.zip && unzip -oq duckdb_cli-linux-amd64.zip
          chmod +x ./duckdb && ./duckdb -c "SELECT version();"
          cat > probe.sql <<SQL
          INSTALL iceberg FROM core_nightly; LOAD iceberg;
          SELECT extension_version AS iceberg_ext FROM duckdb_extensions() WHERE extension_name='iceberg';
          CREATE OR REPLACE SECRET glue_secret (
              TYPE S3, KEY_ID '$S3_KEY', SECRET '$S3_SECRET', REGION '$GLUE_REGION');
          ATTACH OR REPLACE '$GLUE_WAREHOUSE' AS cat_db (
              TYPE iceberg,
              ENDPOINT 'https://glue.$GLUE_REGION.amazonaws.com/iceberg',
              AUTHORIZATION_TYPE 'sigv4',
              STAGE_CREATE_TABLES false, SECRET glue_secret);
          DROP TABLE IF EXISTS cat_db.demo.probe_nightly;
          CREATE TABLE cat_db.demo.probe_nightly (a INTEGER) WITH ('location' = '${GLUE_LOCATION%/}/probe_nightly');
          INSERT INTO cat_db.demo.probe_nightly VALUES (1),(2),(3);
          SELECT count(*) AS count_in_session FROM cat_db.demo.probe_nightly;
          DETACH cat_db;
          ATTACH OR REPLACE '$GLUE_WAREHOUSE' AS cat2 (
              TYPE iceberg,
              ENDPOINT 'https://glue.$GLUE_REGION.amazonaws.com/iceberg',
              AUTHORIZATION_TYPE 'sigv4',
              STAGE_CREATE_TABLES false, SECRET glue_secret);
          SELECT count(*) AS count_on_reattach FROM cat2.demo.probe_nightly;
          SQL
          ./duckdb < probe.sql || true
